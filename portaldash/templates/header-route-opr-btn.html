        /* margin: 20px 0; */

        border-radius: 5px;

</style>

<script>
    // Function to format number with commas in Indian format
    function formatNumber(num) {
        const str = num.toString();
        const lastThreeDigits = str.slice(-3);
        const otherDigits = str.slice(0, -3);
        const formattedOtherDigits = otherDigits.replace(/\B(?=(\d{2})+(?!\d))/g, ",");
        return otherDigits ? formattedOtherDigits + "," + lastThreeDigits : lastThreeDigits;
    }

    // Example numbers from backend
    const siteVisit = {{ SiteVisit }};
    const totalPlants = {{ TotalPlantations }};

    // Set the formatted numbers in the HTML
    document.getElementById('site-visit').textContent = formatNumber(siteVisit);
    document.getElementById('total-plants').textContent = formatNumber(totalPlants);

</script>

    <div class="bg-white rounded-lg flex justify-between items-center p-1 flex-wrap">

        <!-- Google Translate Script -->

            }

        <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>


        <div class="text-white gap-2 flex justify-center md:justify-end items-center flex-1">
            <button class="bg-red-800 px-4 py-1" id="mediaGalleryBtn">Media Gallery</button>
            <div id="galleryModalContainer"></div>
            <!-- Include the Video Modal -->
            {% include 'video_modal.html' %}
            <!-- Video Tutorial Button -->
            <button class="bg-red-800 px-4 py-1" id="videoTutorialBtn">Video Tutorial</button>
          

            <!-- Placeholder to Load Modal -->
            <div id="videoModalContainer"></div>


            <!-- <button class="bg-red-800 px-4 py-1">Video Tutorial</button> -->
            {% if user.is_authenticated and user.is_admin %}
                <button class="bg-red-800 px-4 py-1"><a href="{% url 'dashboardadm' %}" class="no-underline">Monitoring</a></button>
                <button class="bg-red-800 px-4 py-1" onclick="logoutAndRefresh()">Logout</button>
            {% else %}
                <button class="bg-red-800 px-4 py-1"><a href="/admin/loginadm/" class="no-underline">Admin Login</a></button>
            {% endif %}
        </div>
        <div id="videoModal" class="modal video-modal">
            <div class="modal-content">
                <span class="close video-close">&times;</span>
                <video id="tutorialVideo" controls>
                    <source src="{% static 'base_static/video_hariyalo_rajasthan.mp4' %}" type="video/mp4">
                </video>
            </div>
        </div>
        <script>
            function logoutAndRefresh() {
                fetch("{% url 'logoutadm' %}", {method: 'GET'})
                .then(response => response.text()) // Handle HTML response
                .then(data => {
                    // Clear all web storage
                    localStorage.clear();
                    sessionStorage.clear();
                    // Remove cookies
                    document.cookie = "sessionid=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;";
                    // Refresh the page
                    window.location.reload();
                });
            }
        
            document.addEventListener("DOMContentLoaded", function () {
                // Video Modal Logic
                const videoBtn = document.getElementById("videoTutorialBtn");
                const videoModalContainer = document.getElementById("videoModalContainer");
        
                if (videoBtn) {
                    videoBtn.addEventListener("click", function () {
                        fetch("{% url 'video_modal' %}")  // Fetch video modal from Django view
                        .then(response => response.text())
                        .then(html => {
                            videoModalContainer.innerHTML = html;  // Load modal content
                            document.getElementById("videoModal").style.display = "flex";
        
                            // Add event listeners for closing the modal
                            const videoCloseBtn = document.querySelector(".video-close");
                            const video = document.getElementById("tutorialVideo");
        
                            videoCloseBtn.addEventListener("click", function () {
                                document.getElementById("videoModal").style.display = "none";
                                video.pause();
                            });
        
                            window.addEventListener("click", function (event) {
                                if (event.target === document.getElementById("videoModal")) {
                                    document.getElementById("videoModal").style.display = "none";
                                    video.pause();
                                }
                            });
                        });
                    });
                }
        
                // Media Gallery Modal Logic (Step 6)
                const mediaGalleryBtn = document.getElementById("mediaGalleryBtn");
                const galleryModalContainer = document.getElementById("galleryModalContainer");
        
                if (mediaGalleryBtn) {
                    mediaGalleryBtn.addEventListener("click", function () {
                        fetch("{% url 'gallery_view' %}")  // Fetch gallery.html dynamically
                        .then(response => response.text())
                        .then(html => {
                            galleryModalContainer.innerHTML = html;  // Load modal content
                            document.getElementById("galleryModal").style.display = "flex";
        
                            // Close modal when clicking outside
                            window.addEventListener("click", function (event) {
                                if (event.target === document.getElementById("galleryModal")) {
                                    document.getElementById("galleryModal").style.display = "none";
                                }
                            });
        
                            // Image Popup Modal Logic
                            document.querySelectorAll(".gallery-image").forEach(image => {
                                image.addEventListener("click", function () {
                                    document.getElementById("popupImage").src = this.src;
                                    document.getElementById("imagePopupModal").style.display = "flex";
                                });
                            });
        
                            document.querySelector(".image-close").addEventListener("click", function () {
                                document.getElementById("imagePopupModal").style.display = "none";
                            });
        
                            document.querySelector(".gallery-close").addEventListener("click", function () {
                                document.getElementById("galleryModal").style.display = "none";
                            });
                        });
                    });
                }
            });
        </script>
        
        


    </div>
