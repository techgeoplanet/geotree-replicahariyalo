<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Image with Cancel Button</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom styles to enhance UI */
        .image-preview {
            max-width: 200px;
            max-height: 200px;
            border-radius: 8px;
            border: 2px solid #ddd;
            padding: 4px;
            display: inline-block;
            margin: 10px 0;
        }
        .cancel-button {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background-color: #f44336;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        .cancel-button:hover {
            background-color: #e74c3c;
        }
    </style>
</head>
<body class="bg-gray-100 p-6">
        <!-- Main Content -->
        <header class="header-fixed bg-white py-3 flex justify-center items-center px-4 border-b border-blue-900 z-30">
            <!-- Burger Icon (visible on mobile/tablet) -->
            <div class="lg:hidden">
                <button id="burger" class="text-4xl focus:outline-none">
                    <i class="material-icons text-4xl primary_text_c">menu</i>
                </button>
            </div>
    
            <div class="w-11/12 flex justify-center items-center">
                <div class="mr-10 w-[200px]">
                    <img src="{% static 'assets/GPSPL.png' %}" alt="Logo" class="aspect-auto">
                </div>
    
                <!-- Navbar Links -->
                <div class="w-6/12 flex flex-row items-center justify-start hidden lg:flex">
                    <div class="el1 w-max px-4 relative group">
                        <div class="meterline flex items-center justify-evenly cursor-pointer">
                            <div class="absolute inset-0 bg-blue-100 rounded-[10px] scale-0 group-hover:scale-100 transition-all duration-300 ease-in-out p-3"></div>
                            <div class="progress mr-2 header_text_c transition-transform duration-300 group-hover:scale-110">Product</div>
                            <i class="material-icons header_text_c transition-transform duration-300 group-hover:rotate-180">keyboard_arrow_down</i>
                        </div>
                        <!-- Dropdown -->
                        <div class="dropdown-content absolute top-full left-0 w-fit text-black transition-all duration-300 ease-in-out z-50 shadow-[0_4px_6px_-1px_rgba(1,35,108,0.1),0_2px_4px_-1px_rgba(1,35,108,0.06)] rounded-[10px] mt-4 bg-white">
                            {% include "components/productlist.html" %}
                        </div>
                    </div>
    
                    <div class="el2 w-max px-4 relative group">
                        <div class="meterline flex items-center justify-evenly cursor-pointer">
                            <div class="absolute inset-0 bg-blue-100 rounded-[10px] scale-0 group-hover:scale-100 transition-all duration-300 ease-in-out p-3"></div>
                            <div class="progress mr-2 header_text_c transition-transform duration-300 group-hover:scale-110">Resources</div>
                            <i class="material-icons header_text_c transition-transform duration-300 group-hover:rotate-180">keyboard_arrow_down</i>
                        </div>
                        <!-- Dropdown -->
                        <div class="dropdown-content absolute top-full left-0 w-fit text-black transition-all duration-300 ease-in-out z-50 shadow-[0_4px_6px_-1px_rgba(1,35,108,0.1),0_2px_4px_-1px_rgba(1,35,108,0.06)] rounded-[10px] mt-4 bg-white">
                            {% include "components/resourceslist.html" %}
                        </div>
                    </div>
    
                    <div class="el3 w-max px-4" onclick="scrollToSection('pricing')">
                        <div class="meterline flex items-center justify-evenly cursor-pointer group">
                            <div class="progress mr-2 p-4 header_text_c rounded-full hover:scale-105 transition-all duration-300 ease-in-out relative overflow-hidden group">
                                <div class="absolute inset-0 bg-blue-100 rounded-full scale-0 group-hover:scale-150 transition-all duration-300 ease-in-out"></div>
                                    <span class="relative z-10 select-none">Pricing</span>
                                    <span class="absolute inset-0 bg-gray-200 opacity-0 group-hover:opacity-25 transform scale-x-0 group-hover:scale-x-100 transition-transform origin-left duration-300 ease-in-out"></span>
                                </div>
                            </div>
                        </div>
                        <script>
                            function scrollToSection(sectionId) {
                                document.getElementById(sectionId).scrollIntoView({ behavior: 'smooth' });
                            }
                        </script>
                    </div>
    
                <div class="w-2/12 hidden lg:flex justify-end mr-2">
                    <a href="#" class="w-max flex flex-col items-center justify-center relative cursor-pointer group">
                        <span class="relative">
                            <div class="support-chat-wave"></div>
                            <div class="support-chat-wave" style="animation-delay: 0.5s;"></div>
                            <div class="support-chat-wave" style="animation-delay: 1s;"></div>
                            <img src="{% static 'assets/support.svg' %}" alt="Support Icon" class="aspect-auto relative z-10 group-hover:scale-110 transition-transform duration-300 ease-in-out">
                        </span>
                        <span class="text-center text-xs primary_text_c mt-1">Support Chat</span>
                    </a>
                </div>
    
    
                <div class="w-fit hidden lg:flex justify-center items-center space-x-1">
                    <button
                        class="px-4 py-1 flex items-center rounded-full hover:scale-105 transition-all duration-300 ease-in-out relative overflow-hidden group">
                        <i class="material-icons mr-2 primary_text_c">language</i>
                        <span class="primary_text_c">En</span>
                        <span
                            class="absolute inset-0 bg-gray-200 opacity-0 group-hover:opacity-25 transform scale-x-0 group-hover:scale-x-100 transition-transform origin-left duration-300 ease-in-out"></span>
                    </button>
                    <a href="{% url 'login' %}" class="px-4 py-1 primary_text_c rounded-full whitespace-nowrap hover:scale-105 transition-all duration-300 ease-in-out relative overflow-hidden group">
                        <span class="relative z-10">Log In</span>
                        <span
                            class="absolute inset-0 bg-gray-200 opacity-0 group-hover:opacity-25 transform scale-x-0 group-hover:scale-x-100 transition-transform origin-left duration-300 ease-in-out"></span>
                    </a>
                    <button
                        onclick="scrollToSection('pricing')"
                        class="rounded-full primary_c px-5 py-1 w-fit text-white whitespace-nowrap hover:shadow-[0_4px_6px_rgba(0,0,0,0.1)] hover:scale-105 transition-all duration-300 ease-in-out relative overflow-hidden group">
                        <span class="relative z-10">Try Free</span>
                        <span
                            class="absolute inset-0 bg-white opacity-0 group-hover:opacity-25 transform scale-x-0 group-hover:scale-x-100 transition-transform origin-left duration-300 ease-in-out"></span>
                    </button>
                </div>
            </div>
        </header>




    <!-- Modal Overlay -->
    <div id="notification-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center z-50">
        <!-- Modal Content -->
        <div class="bg-white rounded-lg p-8 max-w-md mx-4 relative">
            <!-- Close button -->
            <button onclick="closeModal()" class="absolute top-2 right-2 text-gray-500 hover:text-gray-700">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>

            <!-- Notification Content -->
            <div class="text-center">
                <div class="text-green-500 mb-4">
                    <svg class="w-16 h-16 mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                </div>
                <h3 class="text-xl font-bold text-gray-900 mb-4" id="modal-title">Register Now</h3>
                <p class="text-gray-600 mb-6" id="modal-message">Please register to continue using our services.</p>
                <button onclick="closeModal()" class="bg-green-500 text-white px-4 py-2 rounded hover:bg-green-600">
                    Close
                </button>
            </div>
        </div>
    </div>

    <script>
        function showNotification(title, message) {
            const modal = document.getElementById('notification-modal');
            const modalTitle = document.getElementById('modal-title');
            const modalMessage = document.getElementById('modal-message');
            
            modalTitle.textContent = title;
            modalMessage.textContent = message;
            modal.classList.remove('hidden');
            modal.style.position = 'fixed';
            modal.style.top = '0';
            modal.style.left = '0';
            modal.style.width = '100%';
            modal.style.height = '100%';
            modal.style.zIndex = '9999';
        }

        function closeModal() {
            const modal = document.getElementById('notification-modal');
            modal.classList.add('hidden');
        }

        // Show notification on page load
        window.onload = function() {
            showNotification('Register Now', 'Please register to continue using our services.');
        }
    </script>
    <h1>EKKIJDIJRFCJHBHICBRFBCHCFB</h1>

</body>
</html>
