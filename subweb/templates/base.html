{% load static %}
<!DOCTYPE html>
<html>

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        
        <title>{% block title %}{% endblock %}</title>
        <link rel="icon" href="{% static 'base/images/fiv-icon.png' %}"
        type="image/x-icon">
        <link rel="stylesheet"href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.16/dist/tailwind.min.css">

        <link rel="stylesheet" href="{% static 'base/css/base.css' %}">
        
        {% block extra_css %}{% endblock %}
    </head>

    <body>
        <div class="bg-container" style="background-image: url('{% static 'home/images/bg.webp' %}')"></div>
        <nav class="navbar"
            style="display: flex; justify-content: space-between; align-items: flex-end; padding-left: 0; top: 0; gap: 0;">
            <div class="left-image" style="width:max-content;"><img
                    src="{% static 'home/images/logo.webp' %}" alt="Left Photo"
                    class="fixed-photo left-photo"></div>
            <div class="center-image"
                style="width: max-content; height: 100%; display: flex; justify-content: center; align-items: center; "><img
                    src="{% static 'home/images/logotext.webp' %}"
                    alt="center Photo" class="center-photo"
                    style="width: 110%;"></div>
            <div class="right-image" style="width: max-content;"><img
                    src="{% static 'home/images/cm.webp' %}" alt="Right Photo"
                    class="fixed-photo right-photo"></div>
        </nav>

        {% block content %}
        {% endblock %}

    </body>

</html>
