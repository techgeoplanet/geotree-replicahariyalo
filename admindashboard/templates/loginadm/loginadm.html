{% load static %}

<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Email Login</title>
        <link rel="stylesheet" href="{%static 'loginadm/loginadm.css'%}">
        <link rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.16/dist/tailwind.min.css">
    </head>

    <body class="flex-wrap">
        <div class="bg-container" style="background-image: url('{% static 'baseadm/baseimages/bg.webp' %}')"></div>

        {% include 'header.html' %}

        <div class="login-container flex justify-center items-center flex-col" style="position: relative;">
            <button class="text-sm" style="position: absolute; top: 0; right: 0; padding: 2px 10px 2px 10px; border-radius: 100px; background-color: forestgreen; color: #ffff; border-width: 0;" onclick="window.history.back();">Skip</button>


            <img src="{%static 'home/images/logo.webp'%}" alt="Logo"
                class="logo">

            <form method="POST" action="{% url 'loginadm' %}" id="loginFormadm">
                {% csrf_token %}
                <!-- Email input field -->
                <div class="input-group">
                    <input type="email" class="input-field"
                        placeholder="Enter Email" name="email" required>
                </div>
                <!-- Password input field -->
                <div class="input-group password-wrapper">
                    <label for="password" class="visually-hidden"></label>
                    <input type="password" id="password" class="input-field"
                        placeholder="Enter Password" name="password" required
                        aria-label="Password">
                    <div class="password-toggle-icon" id="togglePassword">
                        <i class="fa fa-eye toggle-password"
                            onclick="togglePasswordVisibility('password', 'togglePassword')"></i>
                    </div>
                </div>
                <div class="extra"><a href>Forgot Password?</a></div>
                <br>
                {% if error %}
                <p>{{ error }}</p>
                {% endif %}

                <!-- Register button -->
                <button type="submit" id="registerBtn" class="login-btn text-lg">
                    Login
                </button>
                <div>
                    <a href="{% url 'regadm' %}" style="text-decoration: none;
            color: black;
            font-size: 15px;">Register</a>
                </div>
                <div>
                    <a href="{% url 'tempuser_login' %}" style="text-decoration: none;
            color: black;
            font-size: 15px; margin-top:5px;">Login as User</a>
                </div>
            </form>
            
        </div>

        {% include 'hi/footer/footer.html' %}
        <!-- <div class="footer">Developed by GPSPL</div> -->

        <script src="{%static 'loginadm/loginadm.js'%}">
     
        </script>
    </body>

</html>
