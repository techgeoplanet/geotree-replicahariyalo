{% load static %}
{% block extra_css %}
<link rel="stylesheet" href="{% static 'components/download_kmz/downloadz.css' %}">
{% endblock %}

{% block content %}
    <div class="card_download_z">
        <!-- Section 1: Module Name -->
        <div class="section">
            <h2>Download KMZ</h2>
        </div>

        <!-- Section 2: Checkboxes -->
        <div class="section">
            <div class="checkbox-container">
                <label><input type="checkbox" class="checkbox" value="1"><span>Private Individual</span></label>
                <label><input type="checkbox" class="checkbox" value="2"><span>Government Individual</span></label>
                <label><input type="checkbox" class="checkbox" value="3"><span>NGO Individual</span></label>
                <label><input type="checkbox" class="checkbox" value="4"><span>Block Plantation</span></label> 
            </div>
        </div>

        <!-- Section 3: District Name -->
        <div class="section">
            <label for="district" class="label">District Name:</label>
            {% if first_block %}
                <input type="text" id="district" name="district" placeholder="Enter district name" value="{{ first_block.DISTRICT_N }}" readonly>
            {% else %}
                <input type="text" id="district" name="district" placeholder="Enter district name" value="">
            {% endif %}
        </div>

        <!-- Section 4: Blocks -->
        <div class="section">
            <label for="district" class="label">Block Name:</label>

            <div id="selected-blocks"></div>
            <div id="blocks-container">
                <!-- Checkboxes will be populated here -->
                {% for block in sub_data %}
                    <label for="block-{{ block.BLOCK_C }}">
                        <input type="checkbox" class="checkbox" id="block-{{ block.BLOCK_C }}" name="{{ block.BLOCK_N }}" value="{{ block.BLOCK_C }}">
                        {{ block.BLOCK_N }}
                        
                    </label>
                {% endfor %}
            </div>
        </div>
        <input type="hidden" name="csrfmiddlewaretoken" value="{{ csrf_token }}">


        <!-- Section 5: Button -->
        <div class="section button-section">
            <a id="download-button" href="" class="hidden" download>Download KMZ</a>
            <button id="submit-button">Generate</button>
        </div>

        <!-- Loading and Download Sections -->
       <!-- Somewhere in your HTML -->
        <div id="loading-indicator" class="hidden">Generating kmz plz wait...</div>

        <!-- <div id="download-section">
            <a id="download-button" href="" class="hidden" download>Download KMZ</a>
        </div> -->

       
    </div>


    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const section2Checkboxes = document.querySelectorAll('.checkbox-container .checkbox');
            // Event listener for checkboxes in Section 2
            section2Checkboxes.forEach(checkbox => {
                checkbox.addEventListener('change', (event) => {
                    if (event.target.checked) {
                        // Uncheck all other checkboxes
                        section2Checkboxes.forEach(otherCheckbox => {
                            if (otherCheckbox !== event.target) {
                                otherCheckbox.checked = false;
                            }
                        });
                    }
                });
            });
        });
    </script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const districtInput = document.getElementById('district');
            const blocksContainer = document.getElementById('blocks-container');
            const selectedBlocksContainer = document.getElementById('selected-blocks');
            const submitButton = document.getElementById('submit-button');
            const loadingIndicator = document.getElementById('loading-indicator');
            const downloadButton = document.getElementById('download-button');
            const section2Checkboxes = document.querySelectorAll('.checkbox-container .checkbox'); // Section 2 checkboxes
            const blockCheckboxes = document.querySelectorAll('#blocks-container .checkbox'); // Block checkboxes

            // Populate blocks container with sample data
            function populateBlocks() {
                blocksContainer.classList.remove('disabled');
                blocksContainer.querySelectorAll('input[type="checkbox"]').forEach(checkbox => {
                    checkbox.addEventListener('change', (event) => {
                        const blockName = event.target.name;
                        const blockValue = event.target.value;
                        if (event.target.checked) {
                            addSelectedBlock(blockValue, blockName);
                        } else {
                            removeSelectedBlock(blockValue);
                        }
                        toggleSubmitButton(); // Update submit button state
                    });
                });
            }

            populateBlocks();

            // Add selected block to the selected blocks container
            function addSelectedBlock(value, name) {
                const block = document.createElement('div');
                block.className = 'selected-block';
                block.textContent = name;
                block.dataset.value = value; // Store the value as a data attribute

                const cross = document.createElement('span');
                cross.className = 'cross';
                cross.textContent = 'x';
                cross.addEventListener('click', () => {
                    removeSelectedBlock(value);
                });

                block.appendChild(cross);
                selectedBlocksContainer.appendChild(block);

                // Mark the corresponding checkbox as checked
                document.querySelector(`input[value="${value}"]`).checked = true;
            }

            // Remove selected block from the selected blocks container
            function removeSelectedBlock(value) {
                const blocks = selectedBlocksContainer.querySelectorAll('.selected-block');
                blocks.forEach(block => {
                    if (block.dataset.value === value) {
                        block.remove();
                        document.querySelector(`input[value="${value}"]`).checked = false;
                    }
                });
                toggleSubmitButton(); // Update submit button state
            }

            // Function to check if at least one checkbox in Section 2 is checked
            function isSection2Valid() {
                return Array.from(section2Checkboxes).some(checkbox => checkbox.checked);
            }

            // Function to check if at least one checkbox in blocks-container is checked
            function isBlocksContainerValid() {
                return Array.from(blockCheckboxes).some(checkbox => checkbox.checked);
            }

            // Function to check if the form is valid
            function isFormValid() {
                return isSection2Valid() && isBlocksContainerValid();
            }

            // Enable/Disable submit button based on form validity
            function toggleSubmitButton() {
                const formIsValid = isFormValid();
                submitButton.disabled = !formIsValid;

                // Change button color based on validity
                if (formIsValid) {
                    submitButton.style.backgroundColor = 'green';
                } else {
                    submitButton.style.backgroundColor = 'gray';
                }
            }

            // Event listeners for checkbox changes
            section2Checkboxes.forEach(checkbox => {
                checkbox.addEventListener('change', toggleSubmitButton);
            });

            blockCheckboxes.forEach(checkbox => {
                checkbox.addEventListener('change', toggleSubmitButton);
            });

            // Initial check on page load
            toggleSubmitButton();

            //-----------------------------------------------------------------------------------------------------------------------------------
            // Get the CSRF token from the cookie
            // function getCSRFToken() {
            //     let csrfToken = null;
            //     const cookies = document.cookie.split(';');
            //     for (let cookie of cookies) {
            //         cookie = cookie.trim();
            //         if (cookie.startsWith('csrftoken=')) {
            //             csrfToken = cookie.substring('csrftoken='.length, cookie.length);
            //             break;
            //         }
            //     }
            //     return csrfToken;
            // }

            //----------------------------------------------------------------------------------------------------------------------------------



            function generateKML(records, selectedsection) {
                const kmlHeader = `<?xml version="1.0" encoding="UTF-8"?>
                <kml xmlns="http://www.opengis.net/kml/2.2">
                <Document><name>Plantation Data</name>`;

                const kmlFooter = `</Document></kml>`;
                
                
                let kmlPlacemark;

                if (selectedsection === '1') {
                    kmlPlacemark = record => `
                        <Placemark>
                            <name>${record.plantation_name || ''}</name>
                            <description>
                                <![CDATA[
                                    <strong>Plantation ID:</strong> PVT-${record.id || 'N/A'}<br/>
                                    <strong>Plant Name:</strong> ${record.plantation_name || 'N/A'}<br/>
                                    <strong>Height:</strong> ${record.plantation_height || 'N/A'}<br/>
                                    <strong>Created At:</strong> ${record.created_at || 'N/A'}<br/>
                                ]]>
                            </description>
                            <Point>
                                <coordinates>${record.location_long || ''},${record.location_lat || ''},0</coordinates>
                            </Point>
                        </Placemark>`;
                } 
                else if (selectedsection === '2') {
                    kmlPlacemark = record => `
                        <Placemark>
                            <name>${record.plantation_name || ''}</name>
                            <description>
                                <![CDATA[
                                    <strong>Plantation ID:</strong> GOV-${record.id || 'N/A'}<br/>
                                    <strong>Plantation By Department:</strong> ${record.gov_department_id__department_name || 'N/A'}<br/>
                                    <strong>Land Ownership:</strong> ${record.land_ownership__land_ownership || 'N/A'}<br/>
                                    <strong>Height:</strong> ${record.plantation_height || 'N/A'}<br/>
                                    <strong>Created At:</strong> ${record.created_at || 'N/A'}<br/>
                                ]]>
                            </description>
                            <Point>
                                <coordinates>${record.location_long || ''},${record.location_lat || ''},0</coordinates>
                            </Point>
                        </Placemark>`;
                } 
                else if (selectedsection === '3') {
                    kmlPlacemark = record => `
                        <Placemark>
                            <name>${record.plantation_name || ''}</name>
                            <description>
                                <![CDATA[
                                    <strong>Plantation ID:</strong> NGO-${record.id || 'N/A'}<br/>
                                    <strong>Name:</strong> ${record.ngo_name || 'N/A'}<br/>
                                    <strong>Plant Name:</strong> ${record.plantation_name || 'N/A'}<br/>
                                    <strong>Land Ownership:</strong> ${record.land_ownership__land_ownership || 'N/A'}<br/>
                                    <strong>Height:</strong> ${record.plantation_height || 'N/A'}<br/>
                                    <strong>Created At:</strong> ${record.created_at || 'N/A'}<br/>
                                ]]>
                            </description>
                            <Point>
                                <coordinates>${record.location_long || ''},${record.location_lat || ''},0</coordinates>
                            </Point>
                        </Placemark>`;
                } 
                else {
                    kmlPlacemark = (record) => {
                        // Parse location_list as JSON
                        const parseCoordinates = (locationList) => {
                            try {
                                const coords = JSON.parse(locationList); // Convert from string to array
                                if (Array.isArray(coords) && coords.length > 0) {
                                    const parsedCoords = coords.map(coord => [parseFloat(coord[0]), parseFloat(coord[1])]); // Ensure floats
                                    
                                    // Ensure the polygon closes by repeating the first coordinate at the end
                                    if (parsedCoords.length > 2) {
                                        parsedCoords.push(parsedCoords[0]); // Closing the loop
                                    }

                                    return parsedCoords;
                                }
                            } catch (e) {
                                console.error("Invalid JSON format in location_list:", locationList, e);
                            }
                            return [];
                        };

                        const coordinatesArray = parseCoordinates(record.location_list);
                        const coordinatesString = coordinatesArray.length
                            ? coordinatesArray.map(coord => `${coord[1]},${coord[0]},0`).join(' ')
                            : '';

                        return `
                            <Placemark>
                                <name>${record.number_of_plants || ''}</name>
                                <description>
                                    <![CDATA[
                                        <strong>Plantation ID:</strong> BLOCK-${record.id || 'N/A'}<br/>
                                        <strong>Plants Name:</strong> ${record.planta_name_text || 'N/A'}<br/>
                                        <strong>Plantation By Department:</strong> ${record.goverment_departmet__department_name || 'N/A'}<br/>
                                        <strong>Land Ownership:</strong> ${record.land_ownership__land_ownership || 'N/A'}<br/>
                                        <strong>Number Of Plants:</strong> ${record.number_of_plants || 'N/A'}<br/>
                                        <strong>Area:</strong> ${record.plantationArea || 'N/A'} Hec<br/>
                                        <strong>Created At:</strong> ${record.created_at || 'N/A'}<br/>
                                    ]]>
                                </description>
                                <!-- Style: Yellow bold outline, No Fill -->
                                <Style>
                                    <LineStyle>
                                        <color>ffff00ff</color>  <!-- Yellow (AABBGGRR format, so ffff00ff means fully opaque yellow) -->
                                        <width>3</width>  <!-- Bold outline -->
                                    </LineStyle>
                                    <PolyStyle>
                                        <color>00ffffff</color>  <!-- Transparent fill (00 = fully transparent) -->
                                        <fill>0</fill>  <!-- No fill -->
                                    </PolyStyle>
                                </Style>
                                
                                <!-- Point -->
                                <Point>
                                    <coordinates>${record.location_long || ''},${record.location_lat || ''},0</coordinates>
                                </Point>
                                <!-- Polygon -->
                                ${coordinatesString ? `
                                <Polygon>
                                    <outerBoundaryIs>
                                        <LinearRing>
                                            <coordinates>
                                                ${coordinatesString}
                                            </coordinates>
                                        </LinearRing>
                                    </outerBoundaryIs>
                                </Polygon>
                                ` : ''}
                            </Placemark>`;
                    };

                }

            
                const kmlBody = records.map(record => kmlPlacemark(record)).join('\n');
                return kmlHeader + kmlBody + kmlFooter;
            }

            //--------------------------------------------------------------------------------------------------------
            async function createKMZ(kmlData) {
                const JSZip = window.JSZip;
                const zip = new JSZip();
                
                // Add KML file to the ZIP
                zip.file('doc.kml', kmlData);

                // Generate the ZIP file
                const kmzBlob = await zip.generateAsync({ type: 'blob' });
                return kmzBlob;
            }

            //---------------------------------------------------------------------------------------------------------
            function downloadKMZFile(kmzBlob) {
                const url = URL.createObjectURL(kmzBlob);
                downloadButton.href = url;
                downloadButton.classList.remove('hidden');
                downloadButton.download = 'plantation_data.kmz'; // Set filename for download
            }


            //----------------------------------------------------------------------------------------------------------
            // Event listener for submit button
            submitButton.addEventListener('click', async (event) => {
                event.preventDefault(); // Prevent default form submission

                if (!isFormValid()) {
                    alert('Please select at least one option in both sections.');
                    return;
                }

                // Show loading indicator and disable the submit button
                loadingIndicator.classList.remove('hidden');
                submitButton.disabled = true;
                submitButton.style.backgroundColor = 'gray'; // Change color when disabled

                // Gather selected values
                const selectedParams = {
                    section2: Array.from(section2Checkboxes).filter(checkbox => checkbox.checked).map(checkbox => checkbox.value),
                    blocks: Array.from(blockCheckboxes).filter(checkbox => checkbox.checked).map(checkbox => checkbox.value),
                };

                try {
                    // Send API request
                    const response = await fetch("{% url 'download_kmz' %}", {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-CSRFToken': '{{ csrf_token }}',
                        },
                        body: JSON.stringify(selectedParams),
                    });

                    // Handle response
                    if (response.ok) {
                        const result = await response.json();
                        // console.log('Report generated successfully:', result);
                        // console.log('First record:', result.filtered_records[0]);

                        // Generate KML and KMZ
                        const kmlData = generateKML(result.filtered_records, result.selectedsection);
                        const kmzBlob = await createKMZ(kmlData);

                        // Trigger download of KMZ file
                        downloadKMZFile(kmzBlob);

                        loadingIndicator.classList.add('hidden');
                    } else {
                        throw new Error('Failed to generate the report');
                    }
                } catch (error) {
                    console.error('An error occurred:', error);
                    alert('An error occurred while generating the report.');
                    loadingIndicator.classList.add('hidden'); // Hide loading indicator on error
                } finally {
                    submitButton.disabled = false; // Re-enable the submit button
                    submitButton.style.backgroundColor = 'green'; // Restore color when enabled
                }
            });
        });

    </script>

    {% endblock %}
